<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="#00ED64"/>

  <!-- Fork (left) — bold white -->
  <g fill="white">
    <!-- 3 tines -->
    <rect x="17" y="10" width="3" height="14" rx="1.5"/>
    <rect x="21" y="10" width="3" height="14" rx="1.5"/>
    <rect x="25" y="10" width="3" height="14" rx="1.5"/>
    <!-- neck connector -->
    <rect x="17" y="23" width="11" height="3" rx="1.5"/>
    <!-- handle -->
    <rect x="20" y="26" width="5" height="24" rx="2.5"/>
  </g>

  <!-- Knife (right) — bold white -->
  <g fill="white">
    <!-- blade: tapers from wide top to narrow -->
    <path d="M36 10 L43 10 C43 10 44.5 18 42 24 L36 24 Z" rx="2"/>
    <!-- handle -->
    <rect x="37" y="24" width="5" height="26" rx="2.5"/>
  </g>
</svg>
